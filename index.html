<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121316" />
    <title>Dungeon Runner</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <header class="hud-top">
          <h1>Dungeon Runner</h1>
          <p id="distance">Distance: 0</p>
          <p id="class-name">CLASS: —</p>
          <div class="hud-progress">
            <p id="level">LVL: 1</p>
            <p id="experience">XP: 0 / 3</p>
          </div>
          <div class="hud-resources">
            <p id="gold">Gold: 0</p>
            <p id="attack">ATK: —</p>
            <p id="evade">EVA: —</p>
          </div>
          <div class="health">
            <p id="health-text">HP 20 / 20</p>
            <div
              id="health-bar"
              class="health-bar"
              role="progressbar"
              aria-label="Health"
              aria-valuemin="0"
              aria-valuemax="20"
              aria-valuenow="20"
            >
              <div id="health-fill" class="health-fill"></div>
            </div>
          </div>
        </header>
        <div class="hud-bottom">
          <p id="instruction">Tap a glowing tile to advance one row</p>
          <p id="status" aria-live="polite"></p>
        </div>
      </div>
      <div
        id="game-over"
        class="game-over"
        hidden
        role="dialog"
        aria-labelledby="game-over-title"
        aria-modal="true"
      >
        <div class="game-over-card">
          <h2 id="game-over-title">YOU DIED</h2>
          <p id="game-over-distance">Distance: 0</p>
          <button type="button" id="restart-run">Restart Run</button>
        </div>
      </div>
      <div
        id="shop"
        class="shop"
        hidden
        role="dialog"
        aria-labelledby="shop-title"
        aria-modal="true"
      >
        <div class="shop-card">
          <h2 id="shop-title">TRAVELLING MERCHANT</h2>
          <p id="shop-gold">Gold: 0</p>
          <button
            type="button"
            id="shop-offer-vitality"
            class="shop-offer"
            aria-label="Vitality, 2 gold. +1 max HP"
          >
            <span id="shop-vitality-title" class="shop-offer-title">Vitality — 2 gold</span>
            <span id="shop-vitality-desc" class="shop-offer-desc">+1 max HP (20 → 21)</span>
            <span id="shop-vitality-reason" class="shop-offer-reason"></span>
          </button>
          <button
            type="button"
            id="shop-offer-sharpened"
            class="shop-offer"
            aria-label="Sharpened, 3 gold. +1 attack"
          >
            <span id="shop-sharpened-title" class="shop-offer-title">Sharpened — 3 gold</span>
            <span id="shop-sharpened-desc" class="shop-offer-desc">+1 attack (5 → 6)</span>
            <span id="shop-sharpened-reason" class="shop-offer-reason"></span>
          </button>
          <button
            type="button"
            id="shop-offer-armoured"
            class="shop-offer"
            aria-label="Armoured, 3 gold. +1 defence"
          >
            <span id="shop-armoured-title" class="shop-offer-title">Armoured — 3 gold</span>
            <span id="shop-armoured-desc" class="shop-offer-desc">+1 defence (1 → 2)</span>
            <span id="shop-armoured-reason" class="shop-offer-reason"></span>
          </button>
          <button
            type="button"
            id="shop-offer-evasive"
            class="shop-offer"
            aria-label="Evasive, 2 gold. +1 Evade"
          >
            <span id="shop-evasive-title" class="shop-offer-title">Evasive — 2 gold</span>
            <span id="shop-evasive-desc" class="shop-offer-desc">+1 Evade (1 → 2)</span>
            <span id="shop-evasive-reason" class="shop-offer-reason"></span>
          </button>
          <button type="button" id="shop-leave" aria-label="Leave the travelling merchant">
            Leave
          </button>
        </div>
      </div>
      <div
        id="level-up"
        class="level-up"
        hidden
        role="dialog"
        aria-labelledby="level-up-title"
        aria-modal="true"
      >
        <div class="level-up-card">
          <h2 id="level-up-title">LEVEL UP</h2>
          <p id="level-up-level">Level 2</p>
          <p id="level-up-xp">XP: 3 / 7</p>
          <button
            type="button"
            id="level-up-vitality"
            class="level-up-choice"
            aria-label="Vitality. +1 max HP"
          >
            <span id="level-up-vitality-title" class="level-up-choice-title">Vitality</span>
            <span id="level-up-vitality-desc" class="level-up-choice-desc">+1 max HP</span>
            <span id="level-up-vitality-reason" class="level-up-choice-reason"></span>
          </button>
          <button
            type="button"
            id="level-up-sharpened"
            class="level-up-choice"
            aria-label="Sharpened. +1 attack"
          >
            <span id="level-up-sharpened-title" class="level-up-choice-title">Sharpened</span>
            <span id="level-up-sharpened-desc" class="level-up-choice-desc">+1 attack</span>
            <span id="level-up-sharpened-reason" class="level-up-choice-reason"></span>
          </button>
          <button
            type="button"
            id="level-up-armoured"
            class="level-up-choice"
            aria-label="Armoured. +1 defence"
          >
            <span id="level-up-armoured-title" class="level-up-choice-title">Armoured</span>
            <span id="level-up-armoured-desc" class="level-up-choice-desc">+1 defence</span>
            <span id="level-up-armoured-reason" class="level-up-choice-reason"></span>
          </button>
          <button
            type="button"
            id="level-up-evasive"
            class="level-up-choice"
            aria-label="Evasive. +5 Evade"
          >
            <span id="level-up-evasive-title" class="level-up-choice-title">Evasive</span>
            <span id="level-up-evasive-desc" class="level-up-choice-desc">+5 Evade (max 20)</span>
            <span id="level-up-evasive-reason" class="level-up-choice-reason"></span>
          </button>
        </div>
      </div>
      <div
        id="class-select"
        class="class-select"
        role="dialog"
        aria-labelledby="class-select-title"
        aria-modal="true"
      >
        <div class="class-select-card">
          <h2 id="class-select-title">CHOOSE YOUR CLASS</h2>
          <button
            type="button"
            id="class-select-rogue"
            class="class-option"
            aria-label="Select Rogue"
          >
            <span id="class-rogue-name" class="class-option-name">Rogue</span>
            <span id="class-rogue-desc" class="class-option-desc">Nimble survivor with the best chance to slip past threats.</span>
            <span id="class-rogue-stats" class="class-option-stats">HP 18 · ATK 5 · DEF 1 · EVA 6</span>
          </button>
          <button
            type="button"
            id="class-select-ranger"
            class="class-option"
            aria-label="Select Ranger"
          >
            <span id="class-ranger-name" class="class-option-name">Ranger</span>
            <span id="class-ranger-desc" class="class-option-desc">Flexible fighter with reliable early damage.</span>
            <span id="class-ranger-stats" class="class-option-stats">HP 20 · ATK 6 · DEF 1 · EVA 3</span>
          </button>
          <button
            type="button"
            id="class-select-mage"
            class="class-option"
            aria-label="Select Mage"
          >
            <span id="class-mage-name" class="class-option-name">Mage</span>
            <span id="class-mage-desc" class="class-option-desc">Fragile but devastating without needing magic abilities yet.</span>
            <span id="class-mage-stats" class="class-option-stats">HP 16 · ATK 8 · DEF 0 · EVA 2</span>
          </button>
          <button
            type="button"
            id="class-select-knight"
            class="class-option"
            aria-label="Select Knight"
          >
            <span id="class-knight-name" class="class-option-name">Knight</span>
            <span id="class-knight-desc" class="class-option-desc">Armoured and dependable under sustained damage.</span>
            <span id="class-knight-stats" class="class-option-stats">HP 26 · ATK 4 · DEF 3 · EVA 0</span>
          </button>
          <button
            type="button"
            id="class-select-barbarian"
            class="class-option"
            aria-label="Select Barbarian"
          >
            <span id="class-barbarian-name" class="class-option-name">Barbarian</span>
            <span id="class-barbarian-desc" class="class-option-desc">Huge health and damage, with no defensive tricks.</span>
            <span id="class-barbarian-stats" class="class-option-stats">HP 28 · ATK 7 · DEF 0 · EVA 0</span>
          </button>
          <button
            type="button"
            id="class-select-lorekeeper"
            class="class-option"
            aria-label="Select Lorekeeper"
          >
            <span id="class-lorekeeper-name" class="class-option-name">Lorekeeper</span>
            <span id="class-lorekeeper-desc" class="class-option-desc">A seasoned scholar balancing resilience, armour, and magic.</span>
            <span id="class-lorekeeper-stats" class="class-option-stats">HP 22 · ATK 5 · DEF 2 · EVA 2</span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
