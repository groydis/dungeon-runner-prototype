<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121316" />
    <title>Dungeon Runner</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="hud">
        <header class="hud-top">
          <h1>Dungeon Runner</h1>
          <p id="distance">Distance: 0</p>
          <div class="hud-resources">
            <p id="gold">Gold: 0</p>
            <p id="attack">ATK: 5</p>
            <p id="evade">EVA: 1%</p>
          </div>
          <div class="health">
            <p id="health-text">HP 20 / 20</p>
            <div
              id="health-bar"
              class="health-bar"
              role="progressbar"
              aria-label="Health"
              aria-valuemin="0"
              aria-valuemax="20"
              aria-valuenow="20"
            >
              <div id="health-fill" class="health-fill"></div>
            </div>
          </div>
        </header>
        <div class="hud-bottom">
          <p id="instruction">Tap a glowing tile to advance one row</p>
          <p id="status" aria-live="polite"></p>
        </div>
      </div>
      <div
        id="game-over"
        class="game-over"
        hidden
        role="dialog"
        aria-labelledby="game-over-title"
        aria-modal="true"
      >
        <div class="game-over-card">
          <h2 id="game-over-title">YOU DIED</h2>
          <p id="game-over-distance">Distance: 0</p>
          <button type="button" id="restart-run">Restart Run</button>
        </div>
      </div>
      <div
        id="shop"
        class="shop"
        hidden
        role="dialog"
        aria-labelledby="shop-title"
        aria-modal="true"
      >
        <div class="shop-card">
          <h2 id="shop-title">TRAVELLING MERCHANT</h2>
          <p id="shop-gold">Gold: 0</p>
          <button
            type="button"
            id="shop-offer-heal"
            class="shop-offer"
            aria-label="Field dressing, 1 gold. Restore 5 HP"
          >
            <span id="shop-heal-title" class="shop-offer-title">Field dressing — 1 gold</span>
            <span id="shop-heal-desc" class="shop-offer-desc">Restore 5 HP</span>
            <span id="shop-heal-reason" class="shop-offer-reason"></span>
          </button>
          <button
            type="button"
            id="shop-offer-attack"
            class="shop-offer"
            aria-label="Sharpen weapon, 3 gold. +1 attack for this run"
          >
            <span id="shop-attack-title" class="shop-offer-title">Sharpen weapon — 3 gold</span>
            <span id="shop-attack-desc" class="shop-offer-desc">+1 attack for this run</span>
            <span id="shop-attack-reason" class="shop-offer-reason"></span>
          </button>
          <button type="button" id="shop-leave" aria-label="Leave the travelling merchant">
            Leave
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
